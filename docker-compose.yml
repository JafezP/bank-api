services:

  postgres:
    image: postgres:17
    container_name: bank-postgres
    restart: always

    environment:
      POSTGRES_DB: bank_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  bank-api:
    image: bank-api:latest
    container_name: bank-api

    restart: always

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bank_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      JWT_SECRET_KEY: bank-api-secret-key-bank-api-secret-key

    depends_on:
      - postgres


volumes:
  postgres_data: