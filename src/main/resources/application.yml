spring:

  application:
    name: bank-api

  datasource:
    url: jdbc:postgresql://localhost:5432/bank_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver


  flyway:
    enabled: true
    locations: classpath:db/migration


  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true


logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG


jwt:
  secret-key: ${JWT_SECRET_KEY:bank-api-secret-key-bank-api-secret-key}
  expiration: 86400000

server:
  port: 8080